<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FitFrame - Perfect Social Media Resizer</title>
    <style>
        :root {
            --bg: #0f111a;
            --card: #1a1d29;
            --accent: #8b5cf6;
            --accent-2: #ec4899;
            --accent-3: #f97316;
            --text: #ffffff;
            --muted: #8b8fa3;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        /* Header & Logo */
        header {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .logo-svg {
            width: 50px;
            height: 50px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, var(--accent), var(--accent-2), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        /* Upload Area */
        .upload-zone {
            width: 100%;
            max-width: 600px;
            border: 2px dashed var(--muted);
            border-radius: 16px;
            padding: 3rem 2rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--card);
            margin-bottom: 2rem;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: var(--accent);
            background: #20242f;
        }

        .upload-zone h2 { font-size: 1.5rem; margin-bottom: 0.5rem; }
        .upload-zone p { color: var(--muted); }

        /* Controls */
        .controls {
            display: flex;
            gap: 1.5rem;
            flex-wrap: wrap;
            justify-content: center;
            margin-bottom: 2rem;
            background: var(--card);
            padding: 1.5rem;
            border-radius: 12px;
        }

        .control-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        select, input[type="color"] {
            background: var(--bg);
            color: var(--text);
            border: 1px solid var(--muted);
            padding: 0.5rem 1rem;
            border-radius: 8px;
            outline: none;
        }

        /* Gallery */
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 1.5rem;
            width: 100%;
            max-width: 1200px;
        }

        .preview-card {
            background: var(--card);
            border-radius: 12px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .preview-card img {
            width: 100%;
            height: 250px;
            object-fit: cover; /* Keeps the preview tidy */
            background: #000;
        }

        .card-footer {
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-footer span { font-weight: 600; }
        
        button {
            background: linear-gradient(135deg, var(--accent), var(--accent-2));
            color: white;
            border: none;
            padding: 0.5rem 1rem;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            transition: transform 0.2s;
        }

        button:hover { transform: scale(1.05); }

        /* Hide file input */
        #fileInput { display: none; }
    </style>
</head>
<body>

    <!-- ICONIC LOGO (Pure SVG) -->
    <header>
        <svg class="logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
            <defs>
                <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
                    <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
                    <stop offset="50%" style="stop-color:#ec4899;stop-opacity:1" />
                    <stop offset="100%" style="stop-color:#f97316;stop-opacity:1" />
                </linearGradient>
            </defs>
            <!-- The abstract F / Frame brackets -->
            <path d="M20 10 L80 10 L80 25 L35 25 L35 45 L70 45 L70 60 L35 60 L35 90 L20 90 Z" fill="url(#grad1)" />
            <rect x="5" y="5" width="10" height="90" fill="url(#grad1)" rx="5" />
            <rect x="85" y="85" width="10" height="10" fill="url(#grad1)" rx="5" /> <!-- Bottom right pop -->
        </svg>
        <h1>FitFrame</h1>
    </header>

    <!-- UPLOAD ZONE -->
    <div class="upload-zone" id="dropZone">
        <input type="file" id="fileInput" accept="image/*">
        <h2>Drop Image Here</h2>
        <p>or click to browse</p>
    </div>

    <!-- CONTROLS -->
    <div class="controls" id="controls" style="display: none;">
        <div class="control-group">
            <label>Background Style:</label>
            <select id="bgStyle">
                <option value="blurred">Blurred (Pro)</option>
                <option value="solid">Solid Color</option>
            </select>
        </div>
        <div class="control-group">
            <label>Border Color:</label>
            <input type="color" id="borderColor" value="#000000">
        </div>
    </div>

    <!-- RESULTS GALLERY -->
    <div class="gallery" id="gallery"></div>

    <script>
        const socialSizes = [
            { w: 1080, h: 1080, name: "IG Square" },
            { w: 1080, h: 1350, name: "IG Portrait" },
            { w: 1080, h: 1920, name: "IG Story / TikTok" },
            { w: 1200, h: 675, name: "Twitter / FB" }
        ];

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const gallery = document.getElementById('gallery');
        const controls = document.getElementById('controls');
        const bgStyle = document.getElementById('bgStyle');
        const borderColor = document.getElementById('borderColor');

        let currentImage = null;

        // Click to upload
        dropZone.addEventListener('click', () => fileInput.click());
        
        // Drag and drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });
        dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length) handleFile(e.target.files[0]);
        });

        // Handle Image load
        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    currentImage = img;
                    controls.style.display = 'flex';
                    generateAll();
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        // Re-generate on control change
        bgStyle.addEventListener('change', generateAll);
        borderColor.addEventListener('input', generateAll);

        function generateAll() {
            if (!currentImage) return;
            gallery.innerHTML = ''; // Clear old results

            socialSizes.forEach(size => {
                const canvas = document.createElement('canvas');
                canvas.width = size.w;
                canvas.height = size.h;
                const ctx = canvas.getContext('2d');

                // Background logic
                if (bgStyle.value === 'blurred') {
                    // Fill the canvas with the image, blurred and stretched
                    ctx.filter = 'blur(40px) brightness(0.7)';
                    const scale = Math.max(size.w / currentImage.width, size.h / currentImage.height);
                    const sw = currentImage.width * scale;
                    const sh = currentImage.height * scale;
                    const sx = (size.w - sw) / 2;
                    const sy = (size.h - sh) / 2;
                    ctx.drawImage(currentImage, sx, sy, sw, sh);
                    ctx.filter = 'none';
                } else {
                    // Solid color background
                    ctx.fillStyle = borderColor.value;
                    ctx.fillRect(0, 0, size.w, size.h);
                }

                // Image scaling logic (Fit inside with 5% padding)
                const padding = 0.95; // 95% of canvas size
                const imgRatio = currentImage.width / currentImage.height;
                const canvasRatio = size.w / size.h;

                let drawWidth, drawHeight;

                if (imgRatio > canvasRatio) {
                    drawWidth = size.w * padding;
                    drawHeight = drawWidth / imgRatio;
                } else {
                    drawHeight = size.h * padding;
                    drawWidth = drawHeight * imgRatio;
                }

                const x = (size.w - drawWidth) / 2;
                const y = (size.h - drawHeight) / 2;

                ctx.drawImage(currentImage, x, y, drawWidth, drawHeight);

                // Create Preview Card
                const dataUrl = canvas.toDataURL('image/jpeg', 0.9);
                
                const card = document.createElement('div');
                card.className = 'preview-card';
                card.innerHTML = `
                    <img src="${dataUrl}" alt="${size.name} Preview">
                    <div class="card-footer">
                        <span>${size.name}<br><small style="color:var(--muted)">${size.w}×${size.h}</small></span>
                        <a href="${dataUrl}" download="FitFrame_${size.name.replace(/\s+/g, '_')}.jpg">
                            <button>Download</button>
                        </a>
                    </div>
                `;
                gallery.appendChild(card);
            });
        }
    </script>
</body>
</html>
